# Starter configuration only; verify model support and available hardware first.
model:
  model_id: "google/gemma-3-4b-it"
  trust_remote_code: false
data:
  train_file: "data/sample/helpdesk_dataset.jsonl"
  max_length: 512
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  num_train_epochs: 1
  logging_steps: 10
  output_dir: "outputs/deskbuddy_lora"
